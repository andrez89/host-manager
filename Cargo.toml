[package]
name = "host_manager"
version = "0.1.0"
edition = "2024"
authors = ["Andrez <andre@amovez.it>"]
description = "GTK desktop app for managing blocked domains in the system hosts file"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.9" }
glib = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3.2"
