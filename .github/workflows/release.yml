name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos
            arch: arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos
            arch: x86_64
          - os: windows-2025
            target: x86_64-pc-windows-gnu
            platform: windows
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gtk4 mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-gcc zip
      - if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev pkg-config
        shell: ${{ matrix.platform == 'windows' && 'msys2 {0}' || 'bash' }}
      - if: matrix.platform == 'macos'
        run: brew install gtk4 pkg-config
        shell: ${{ matrix.platform == 'windows' && 'msys2 {0}' || 'bash' }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}
      - if: matrix.platform == 'windows'
        run: echo 'CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc' >> "$GITHUB_ENV"
        shell: ${{ matrix.platform == 'windows' && 'msys2 {0}' || 'bash' }}
      - name: Verify release tag matches Cargo version
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "${GITHUB_REF_NAME#v}" = "$version"
        shell: ${{ matrix.platform == 'windows' && 'msys2 {0}' || 'bash' }}
      - run: cargo test --locked --target ${{ matrix.target }}
        shell: ${{ matrix.platform == 'windows' && 'msys2 {0}' || 'bash' }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
        shell: ${{ matrix.platform == 'windows' && 'msys2 {0}' || 'bash' }}
      - name: Package Linux archive
        if: matrix.platform == 'linux'
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/host_manager" README.md LICENSE dist/
          tar -czf "host-manager-${GITHUB_REF_NAME#v}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" -C dist .
        shell: ${{ matrix.platform == 'windows' && 'msys2 {0}' || 'bash' }}
      - name: Package macOS archive
        if: matrix.platform == 'macos'
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/host_manager" README.md LICENSE dist/
          zip -j "host-manager-${GITHUB_REF_NAME#v}-${{ matrix.platform }}-${{ matrix.arch }}.zip" dist/host_manager dist/README.md dist/LICENSE
        shell: ${{ matrix.platform == 'windows' && 'msys2 {0}' || 'bash' }}
      - name: Package Windows archive
        if: matrix.platform == 'windows'
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/host_manager.exe" README.md LICENSE dist/
          (cd dist && zip "../host-manager-${GITHUB_REF_NAME#v}-windows-${{ matrix.arch }}.zip" host_manager.exe README.md LICENSE)
        shell: ${{ matrix.platform == 'windows' && 'msys2 {0}' || 'bash' }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: host-manager-*-${{ matrix.platform }}-${{ matrix.arch }}.*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --generate-notes
          fi
